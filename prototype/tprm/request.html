(function () {
  var drawers = [].slice.call(document.querySelectorAll('[data-drawer]')), scrims = [].slice.call(document.querySelectorAll('[data-scrim]'));
  function set(d, o) { d.setAttribute('data-open', o); var t = d.querySelector('[data-tab]'); if (t) t.setAttribute('aria-expanded', o); }
  function sync() { var any = drawers.some(function (d) { return d.getAttribute('data-open') === 'true'; }); scrims.forEach(function (s) { s.setAttribute('data-open', any ? 'true' : 'false'); }); }
  function closeAll() { drawers.forEach(function (d) { set(d, 'false'); }); sync(); }
  drawers.forEach(function (d) {
    var t = d.querySelector('[data-tab]');
    if (t) t.addEventListener('click', function () { var o = d.getAttribute('data-open') !== 'true'; closeAll(); set(d, o ? 'true' : 'false'); sync(); });
  });
  scrims.forEach(function (s) { s.addEventListener('click', closeAll); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeAll(); });
  document.querySelectorAll('[role=checkbox]').forEach(function (b) {
    function flip() { b.setAttribute('aria-checked', b.getAttribute('aria-checked') === 'true' ? 'false' : 'true'); }
    b.addEventListener('click', flip);
    b.addEventListener('keydown', function (e) { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); } });
  });
  document.querySelectorAll('button[data-next]').forEach(function (g) {
    var scope = g.closest('section') || document, need = g.getAttribute('data-need');
    function groups() { var n = {}; scope.querySelectorAll('input[type=radio]').forEach(function (r) { n[r.name] = n[r.name] || r.checked; }); return n; }
    function update() {
      var n = groups(), done = 0, all = 0, ok = true;
      for (var k in n) { all++; if (n[k]) done++; else ok = false; }
      if (need === 'words') scope.querySelectorAll('textarea[placeholder]').forEach(function (t) { if (!t.value.trim()) ok = false; });
      if (need === 'fields') {
        scope.querySelectorAll('select').forEach(function (s) { if (s.selectedIndex < 1) ok = false; });
        scope.querySelectorAll('input[type=text]').forEach(function (t) { if (!t.value.trim()) ok = false; });
      }
      if (need) { g.disabled = !ok; g.classList.toggle('go', ok); }
      var c = scope.querySelector('[data-count]');
      if (c && c.firstChild) c.firstChild.nodeValue = c.firstChild.nodeValue.replace(/^\d+/, String(done));
      var lab = scope.querySelector('input[type=radio][data-label]:checked'), t = [].slice.call(g.childNodes).filter(function (x) { return x.nodeType === 3 && x.nodeValue.trim(); }).pop();
      if (lab && t) t.nodeValue = lab.getAttribute('data-label');               // a choice names its button
    }
    scope.addEventListener('change', update); scope.addEventListener('input', update); update();

      if (g.disabled) return; var r = scope.querySelector('input[type=radio][data-next]:checked');

    });
  });
  document.addEventListener('click', function (e) {                            // A5: a row that opens a record opens it anywhere you click
    var r = e.target.closest('[data-go]'); if (!r || e.target.closest('a,button,input,select,textarea,label,[role=checkbox],[data-o11]')) return;
    if (String(window.getSelection ? window.getSelection() : '')) return;
    location.href = r.getAttribute('data-go');
  });
  document.querySelectorAll('[data-open-drawer]').forEach(function (s) {       // A6: a finished step with no record of its own opens the Activity
    function go() { var t = document.querySelector('[data-drawer][aria-label="Activity"] [data-tab]') || document.querySelector('[data-drawer] [data-tab]');
      if (t && t.closest('[data-drawer]').getAttribute('data-open') !== 'true') t.click(); }
    s.addEventListener('click', go);
    s.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
  });
  document.querySelectorAll('[data-role-menu]').forEach(function (b) {          // RBAC: the role menu at the foot of the rail
    var m = document.getElementById(b.getAttribute('aria-controls')); if (!m) return;

  });
  document.querySelectorAll('[data-seen]').forEach(function (b) {              // A7: seen is struck through and drops to the foot of its column
    b.addEventListener('click', function () {
      var card = b.closest('[data-card]'); if (!card || card.classList.contains('is-done')) return;
      card.classList.add('is-done'); b.disabled = true; card.parentNode.appendChild(card);
      var n = card.closest('[data-col]').querySelector('[data-colcount]');
      if (n) n.textContent = String(Math.max(0, parseInt(n.textContent, 10) - 1));
    });
  });
})();
