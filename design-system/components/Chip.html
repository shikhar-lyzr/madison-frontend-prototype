<!doctype html>
<html>
<head><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/design-system/tokens.css"><link rel="stylesheet" href="/design-system/bundle.css"><meta charset="utf-8"><title>Chip</title></head>
<body style="margin:0;background:var(--bg)">
<div class="md-page">
<div class="md-row">
  <button class="md-chip" type="button" aria-pressed="true">All <span class="md-count">7</span></button>
  <span class="md-chip-rule"></span>
  <button class="md-chip is-stop" type="button"><span class="md-ico" style="width:16px;height:16px"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.86 2h8.28L22 7.86v8.28L16.14 22H7.86L2 16.14V7.86z"></path><path d="M12 8v4M12 16h.01"></path></svg></span>Stopped <span class="md-count">1</span></button>
  <button class="md-chip is-risk" type="button"><span class="md-ico" style="width:16px;height:16px"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg></span>At risk <span class="md-count">1</span></button>
  <span class="md-chip-rule"></span>
  <button class="md-chip is-you" type="button"><span class="md-ico" style="width:16px;height:16px"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="10" r="3"></circle><path d="M7 20.66V19a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v1.66"></path></svg></span>Needs you <span class="md-count">2</span></button>
  <button class="md-chip is-wait" type="button"><span class="md-ico" style="width:16px;height:16px"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 22h14M5 2h14"></path><path d="M17 22v-4.17a2 2 0 0 0-.59-1.42L12 12l-4.41 4.41A2 2 0 0 0 7 17.83V22"></path><path d="M7 2v4.17a2 2 0 0 0 .59 1.42L12 12l4.41-4.41A2 2 0 0 0 17 6.17V2"></path></svg></span>Waiting on others <span class="md-count">2</span></button>
  <button class="md-chip is-work" type="button"><span class="md-ico md-spin" style="width:16px;height:16px"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"></path><path d="M16 16h5v5"></path></svg></span>Madison working <span class="md-count">1</span></button>
  <button class="md-chip" type="button"><span class="md-ico" style="width:16px;height:16px"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.1 2.18a9.93 9.93 0 0 1 3.8 0M17.6 3.71a9.95 9.95 0 0 1 2.69 2.7M21.82 10.1a9.93 9.93 0 0 1 0 3.8M20.29 17.6a9.95 9.95 0 0 1-2.7 2.69M13.9 21.82a9.94 9.94 0 0 1-3.8 0M6.4 20.29a9.95 9.95 0 0 1-2.69-2.7M2.18 13.9a9.93 9.93 0 0 1 0-3.8M3.71 6.4a9.95 9.95 0 0 1 2.7-2.69"></path></svg></span>Not started <span class="md-count">2</span></button>
</div>
</div>
</body>
</html>
