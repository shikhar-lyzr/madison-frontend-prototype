<!doctype html>
<html>
<head><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/design-system/tokens.css"><link rel="stylesheet" href="/design-system/bundle.css"><meta charset="utf-8"><title>RiskLevel</title></head>
<body style="margin:0;background:var(--bg)">
<div class="md-page">
<section class="md-sheet is-raised"><div class="md-row">
  <span class="md-level is-high"><svg viewBox="0 0 15 15" aria-hidden="true"><rect x="1" y="11" width="3" height="4" rx="1" fill-opacity="1"></rect><rect x="6" y="7" width="3" height="8" rx="1" fill-opacity="1"></rect><rect x="11" y="3" width="3" height="12" rx="1" fill-opacity="1"></rect></svg>High</span>
