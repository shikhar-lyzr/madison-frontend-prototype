<!doctype html>
<html>
<head><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/design-system/tokens.css"><link rel="stylesheet" href="/design-system/bundle.css"><meta charset="utf-8"><title>Drawer</title></head>
<body style="margin:0;background:var(--bg)">
<div class="md-page">
<div style="display:flex;justify-content:flex-end;padding:0 0 0 60px">
<aside class="md-drawer is-inline" data-open="true" aria-label="Activity" style="height:440px;box-shadow:var(--shadow-drawer)">
  <button class="md-drawer-tab" type="button" aria-expanded="true"><span><span class="md-ico" style="width:14px;height:14px"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></span></span><span>Activity</span></button>
  <div class="md-drawer-body">
    <span class="md-drawer-title">Activity</span>
    <section class="md-stack" style="gap:6px"><span class="md-overline">Who has this test</span>
      <div class="md-who is-you"><span style="color:var(--you);display:flex"><span class="md-ico" style="width:17px;height:17px"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="10" r="3"></circle><path d="M7 20.66V19a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v1.66"></path></svg></span></span><b>You</b><span class="md-doing">Completing the basis</span></div>
      <div class="md-who"><span style="color:var(--ink-3);display:flex"><span class="md-ico" style="width:17px;height:17px"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M10 15V9M14 15V9"></path></svg></span></span><b>Madison</b><span class="md-doing">Preparer, waiting on you</span></div>
      <div class="md-who"><span style="color:var(--ink-3);display:flex"><span class="md-ico" style="width:17px;height:17px"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.1 2.18a9.93 9.93 0 0 1 3.8 0M17.6 3.71a9.95 9.95 0 0 1 2.69 2.7M21.82 10.1a9.93 9.93 0 0 1 0 3.8M20.29 17.6a9.95 9.95 0 0 1-2.7 2.69M13.9 21.82a9.94 9.94 0 0 1-3.8 0M6.4 20.29a9.95 9.95 0 0 1-2.69-2.7M2.18 13.9a9.93 9.93 0 0 1 0-3.8M3.71 6.4a9.95 9.95 0 0 1 2.7-2.69"></path></svg></span></span><b>Ravi Sethuraman</b><span class="md-doing">Signs once, after the checks</span></div>
    </section>
    <section class="md-stack" style="gap:8px"><div style="display:flex;align-items:center"><span class="md-overline">What happened</span><a class="md-link" href="#" style="margin-left:auto">Full history</a></div>
      <div class="md-event is-latest"><span class="md-event-rail"><span class="md-event-dot"></span><span class="md-event-line"></span></span><span class="md-event-text"><span class="md-mono">[date]</span><br><b>Madison</b><span class="md-why"> · Assembled the workpaper</span></span></div>
      <div class="md-event"><span class="md-event-rail"><span class="md-event-dot"></span><span class="md-event-line"></span></span><span class="md-event-text"><span class="md-mono">[date]</span><br><b>You</b><span class="md-why"> · Signed the causes</span></span></div>
      <div class="md-event"><span class="md-event-rail"><span class="md-event-dot"></span></span><span class="md-event-text"><span class="md-mono">3 Apr</span><br><b>Madison</b><span class="md-why"> · Sent 135 requests</span></span></div>
    </section>
  </div>
</aside>
</div>
</div>
</body>
</html>
