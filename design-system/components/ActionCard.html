<!doctype html>
<html>
<head><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/design-system/tokens.css"><link rel="stylesheet" href="/design-system/bundle.css"><meta charset="utf-8"><title>ActionCard</title></head>
<body style="margin:0;background:var(--bg)">
<div class="md-page">
<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px">
  <section class="md-action">
    <div class="md-action-top"><span class="md-id">CTL-118</span><span class="md-name">Dual authorisation</span><span class="md-side">High risk</span></div>
    <div class="md-action-line"><span class="md-tag is-you is-step">Evidence</span>4 wires unanswered past the window</div>
    <div class="md-action-foot"><span class="md-since">Waiting since 28 Apr</span><a class="md-btn is-card" href="#"><span class="md-ico" style="width:16px;height:16px"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 7 2 2 4-4M3 17l2 2 4-4M13 6h8M13 12h8M13 18h8"></path></svg></span>Decide</a></div>
  </section>
  <section class="md-action" style="background:var(--sheet);box-shadow:var(--shadow-lift);transform:translateY(-2px)">
    <div class="md-action-top"><span class="md-id">CTL-142</span><span class="md-name">Authority matrix change</span><span class="md-side">Medium risk</span></div>
    <div class="md-action-line"><span class="md-tag is-you is-step">Scope</span>Sign the script · attribute 3 flagged</div>
    <div class="md-action-foot"><span class="md-since">Waiting since 28 Apr</span><a class="md-btn is-card" href="#" style="background:var(--you);color:var(--on-you);box-shadow:var(--shadow-glow)"><span class="md-ico" style="width:16px;height:16px"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg></span>Sign</a></div>
  </section>
</div>
</div>
</body>
</html>
